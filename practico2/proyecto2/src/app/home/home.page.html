<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Practico II - Programacion de Aplicaciones Moviles II
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-item>
    <ion-input [formControl]="descripcionInput" placeholder="Descripcion de la nota"></ion-input>
    <ion-button slot="end" (click)="agregarNota()">Añadir</ion-button>
  </ion-item>
  <ion-list>
    @for (nota of this.notas(); track nota.id) {
    <ion-item-sliding>
      <ion-item>
        <ion-label>{{nota.descripcion}}</ion-label>
      </ion-item>
      <ion-item-options>
        <ion-item-option>
          <ion-button (click)="editarNota(nota)">Editar Nota</ion-button>
        </ion-item-option>
        <ion-item-option color="danger">
          <ion-button (click)="eliminarNota(nota.id ?? null)" color="danger">Eliminar Nota</ion-button>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>

    }

  </ion-list>

</ion-content>
